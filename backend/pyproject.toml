[project]
name = "rasabavarchi-backend"
version = "1.0.0"
description = "AI Recipe Generator, Smart Meal Planner & Nutrition Coach Backend"
requires-python = ">=3.12"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]